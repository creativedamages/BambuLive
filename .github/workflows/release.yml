name: Build BambuLive for macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source
        run: |
          bash -n build.sh
          plutil -lint Info.plist Node.entitlements
          node --check dashboard/server.js
          node --check dashboard/public/app.js
      - name: Build app and disk image
        run: bash build.sh
        env:
          APP_ZIP: '1'
      - name: Package dashboard source and camera update
        run: |
          ditto -c -k --keepParent dashboard dist/BambuLive-dashboard-source.zip
          (cd dashboard && zip ../dist/BambuLive-camera-update.zip server.js public/app.js)
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BambuLive-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          sha256sum *.dmg *.zip > SHA256SUMS.txt
      - name: Create draft release
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft
          --title "BambuLive $GITHUB_REF_NAME"
          --notes "Ad hoc signed preview for macOS 13.5 and later. Requires an existing working dashboard folder with installed dependencies and FFmpeg. Includes the approved BambuLive icon. The camera update is separate and still requires live-printer validation."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
